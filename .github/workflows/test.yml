name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create Android Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Prepare x86 Native Libraries
      run: |
        mkdir -p player/src/main/jniLibs/x86
        mkdir -p /tmp/ijk
        
        # 抓取官方 ijkplayer x86 核心动态库
        echo "Downloading ijkplayer x86 aar..."
        curl -f -L -s -S -o /tmp/ijk/ijk-x86.aar "https://repo1.maven.org/maven2/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar" || \
        curl -f -L -s -S -o /tmp/ijk/ijk-x86.aar "https://repo.maven.apache.org/maven2/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"

        if [ -f /tmp/ijk/ijk-x86.aar ]; then
          unzip -q -o /tmp/ijk/ijk-x86.aar -d /tmp/ijk/extracted
          cp -r /tmp/ijk/extracted/jni/x86/* player/src/main/jniLibs/x86/
        fi

        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        # 传递编译参数并捕获精确 javac 报错
        ./gradlew assembleRelease -x lint -x test --no-daemon || {
          echo "=== Javac Failure Detected, Showing Compiler Messages ==="
          ./gradlew :player:compileReleaseJavaWithJavac --no-daemon --info | grep -E "(error:|failure|cannot find symbol)" || true
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
