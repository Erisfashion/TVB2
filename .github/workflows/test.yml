name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare x86 Native Libraries
      run: |
        mkdir -p /tmp/ijk-x86
        curl -L -o /tmp/ijk-x86/ijkplayer-x86.aar https://repo1.maven.org/maven2/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar || \
        curl -L -o /tmp/ijk-x86/ijkplayer-x86.aar https://maven.aliyun.com/repository/public/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar
        unzip -q -o /tmp/ijk-x86/ijkplayer-x86.aar -d /tmp/ijk-x86/extracted
        mkdir -p player/src/main/jniLibs/x86
        cp -r /tmp/ijk-x86/extracted/jni/x86/* player/src/main/jniLibs/x86/
        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
