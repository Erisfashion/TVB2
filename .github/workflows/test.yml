name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create Android Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Prepare x86 Native Libraries
      run: |
        mkdir -p player/src/main/jniLibs/x86

        # 从稳定的开源备份仓库拉取 ijkplayer x86 核心二进制库
        BASE_URL="https://raw.githubusercontent.com/CarGuo/GSYVideoPlayer/master/gsyVideoPlayer-x86/src/main/jniLibs/x86"
        SO_FILES=("libijkffmpeg.so" "libijkplayer.so" "libijksdl.so")

        for file in "${SO_FILES[@]}"; do
          echo "Downloading $file..."
          curl -f -L -s -S -o "player/src/main/jniLibs/x86/$file" "$BASE_URL/$file" || true
        done

        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleRelease -x lint -x test --no-daemon --console=plain

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
