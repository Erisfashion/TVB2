name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create Android Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Clean Runner Newer SDK Platforms
      run: |
        # 移除 Ubuntu 24.04 预装的高版本预览平台，防止老版本 AGP 4.2.0 在扫描本地 SDK 时因无法识别扩展格式抛出海量 NumberFormatException
        SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
        if [ -d "$SDK_DIR/platforms" ]; then
          rm -rf "$SDK_DIR"/platforms/android-3[4-9]* "$SDK_DIR"/platforms/android-[4-9]* || true
        fi

    - name: Prepare x86 Native Libraries
      run: |
        mkdir -p player/src/main/jniLibs/x86
        mkdir -p /tmp/ijk_extracted

        # 拉取官方 ijkplayer-x86 AAR 并解压部署动态库
        curl -f -L -s -S -o /tmp/ijk-x86.aar "https://maven.aliyun.com/repository/public/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
        unzip -q -o /tmp/ijk-x86.aar -d /tmp/ijk_extracted
        cp -r /tmp/ijk_extracted/jni/x86/* player/src/main/jniLibs/x86/

        echo "Verified x86 SO files:"
        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleRelease -x lint -x test --no-daemon --console=plain

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
