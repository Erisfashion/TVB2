name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create Android Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Prepare x86 Native Libraries
      run: |
        mkdir -p player/src/main/jniLibs/x86
        mkdir -p /tmp/ijk

        # 尝试从备份源下载含 ijkplayer x86 .so 的归档
        DOWNLOAD_URLS=(
          "https://raw.githubusercontent.com/bilibili/ijkplayer/master/android/ijkplayer/ijkplayer-x86/libs/x86"
          "https://github.com/CarGuo/GSYVideoPlayer/raw/master/gsyVideoPlayer-x86/libs/x86"
          "https://raw.githubusercontent.com/CarGuo/GSYVideoPlayer/v8.1.8/gsyVideoPlayer-x86/libs/x86"
        )

        FILES=("libijkffmpeg.so" "libijkplayer.so" "libijksdl.so")
        
        for base in "${DOWNLOAD_URLS[@]}"; do
          echo "Checking source: $base"
          success=true
          for f in "${FILES[@]}"; do
            if ! curl -f -L -s -S -o "/tmp/ijk/$f" "$base/$f"; then
              success=false
              break
            fi
          done
          if [ "$success" = true ]; then
            echo "Successfully downloaded all x86 SO files from $base"
            cp /tmp/ijk/*.so player/src/main/jniLibs/x86/
            break
          fi
        done

        # 检查下载结果
        ls -la player/src/main/jniLibs/x86/ || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
