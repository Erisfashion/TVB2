name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create Android Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Prepare x86 Native Libraries
      run: |
        mkdir -p player/src/main/jniLibs/x86
        mkdir -p /tmp/ijk_dl

        # 从稳定的 GitHub 归档源下载 x86 架构需要的 .so 库
        SO_BASE_URL="https://github.com/CarGuo/GSYVideoPlayer/raw/v8.1.8/gsyVideoPlayer-x86/libs/x86"
        SO_FILES=("libijkffmpeg.so" "libijkplayer.so" "libijksdl.so")

        for so in "${SO_FILES[@]}"; do
          echo "Downloading $so..."
          curl -f -L -s -S -o "player/src/main/jniLibs/x86/$so" "$SO_BASE_URL/$so" || true
        done

        # 校验下载是否成功，若缺失则输出提醒
        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
