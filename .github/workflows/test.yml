name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create Android Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Prepare x86 SO Libraries
      run: |
        mkdir -p player/src/main/jniLibs/x86
        mkdir -p /tmp/ijk

        echo "Fetching ijkplayer x86 binaries..."
        # 官方 Maven Central 原生源与各大稳定海外直链
        IJK_URLS=(
          "https://repo1.maven.org/maven2/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
          "https://repo.maven.apache.org/maven2/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
        )
        for u in "${IJK_URLS[@]}"; do
          echo "Trying $u"
          if curl -f -L -s -S -o /tmp/ijk/ijk-x86.aar "$u"; then
            if unzip -t /tmp/ijk/ijk-x86.aar > /dev/null 2>&1; then
              unzip -q -o /tmp/ijk/ijk-x86.aar -d /tmp/ijk/unpacked
              cp -r /tmp/ijk/unpacked/jni/x86/* player/src/main/jniLibs/x86/
              echo "Successfully copied x86 so files."
              break
            fi
          fi
        done

        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
