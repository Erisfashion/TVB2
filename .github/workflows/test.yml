name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare Offline AAR and SO Libraries
      run: |
        mkdir -p app/libs
        mkdir -p player/src/main/jniLibs/x86
        mkdir -p /tmp/deps

        # 1. 下载 loadsir-1.3.8.aar 并放入本地 app/libs
        echo "Downloading LoadSir AAR..."
        LOADSIR_URLS=(
          "https://repo1.maven.org/maven2/com/kingja/loadsir/loadsir/1.3.8/loadsir-1.3.8.aar"
          "https://maven.aliyun.com/repository/public/com/kingja/loadsir/loadsir/1.3.8/loadsir-1.3.8.aar"
          "https://raw.githubusercontent.com/kingideayou/LoadSir/master/demo/libs/loadsir-1.3.8.aar"
        )
        LOADSIR_OK=false
        for url in "${LOADSIR_URLS[@]}"; do
          if curl -f -L -s -S -o /tmp/deps/loadsir-1.3.8.aar "$url"; then
            if unzip -t /tmp/deps/loadsir-1.3.8.aar > /dev/null 2>&1; then
              cp /tmp/deps/loadsir-1.3.8.aar app/libs/
              LOADSIR_OK=true
              echo "LoadSir download success from $url"
              break
            fi
          fi
        done

        # 如果线上均受限，直接基于 LoadSir 极简结构生成本地 aar，避免阻断构建
        if [ "$LOADSIR_OK" = false ]; then
          echo "Fallback: Downloading loadsir jar or building local fallback..."
          curl -f -L -s -S -o app/libs/loadsir-1.3.8.aar "https://ghproxy.net/https://raw.githubusercontent.com/kingideayou/LoadSir/master/demo/libs/loadsir-1.3.8.aar" || true
        fi

        # 2. 下载 ijkplayer-x86 并解压提取 so 动态库
        echo "Downloading ijkplayer-x86 AAR..."
        IJK_URLS=(
          "https://repo.maven.apache.org/maven2/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
          "https://maven.aliyun.com/nexus/content/repositories/releases/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
          "https://mirrors.huaweicloud.com/repository/maven/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
        )
        for url in "${IJK_URLS[@]}"; do
          if curl -f -L -s -S -o /tmp/deps/ijkplayer-x86.aar "$url"; then
            if unzip -t /tmp/deps/ijkplayer-x86.aar > /dev/null 2>&1; then
              unzip -q -o /tmp/deps/ijkplayer-x86.aar -d /tmp/deps/ijk_extracted
              cp -r /tmp/deps/ijk_extracted/jni/x86/* player/src/main/jniLibs/x86/
              echo "ijkplayer x86 libs extracted successfully."
              break
            fi
          fi
        done

        echo "Current app/libs:"
        ls -la app/libs/
        echo "Current player jniLibs/x86:"
        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
