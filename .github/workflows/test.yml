name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare x86 Native Libraries
      run: |
        mkdir -p /tmp/ijk-x86
        mkdir -p player/src/main/jniLibs/x86

        # 多镜像轮询拉取 ijkplayer-x86 0.8.8 AAR 归档文件
        URLS=(
          "https://maven.aliyun.com/repository/jcenter/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
          "https://mirrors.huaweicloud.com/repository/maven/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
          "https://raw.githubusercontent.com/bilibili/ijkplayer/k0.8.8/android/ijkplayer/ijkplayer-x86/build/outputs/aar/ijkplayer-x86-release.aar"
          "https://repo.maven.apache.org/maven2/tv/danmaku/ijk/media/ijkplayer-x86/0.8.8/ijkplayer-x86-0.8.8.aar"
        )

        DOWNLOAD_SUCCESS=false
        for url in "${URLS[@]}"; do
          echo "Trying to download from: $url"
          if curl -f -L -s -S -o /tmp/ijk-x86/ijkplayer-x86.aar "$url"; then
            # 校验是否为合法 zip/aar 文件
            if unzip -t /tmp/ijk-x86/ijkplayer-x86.aar > /dev/null 2>&1; then
              echo "Download successful and verified!"
              DOWNLOAD_SUCCESS=true
              break
            fi
          fi
        done

        if [ "$DOWNLOAD_SUCCESS" = false ]; then
          echo "Error: All mirrors failed to download a valid ijkplayer-x86 AAR."
          exit 1
        fi

        # 解压并将 x86 .so 复制到工程目标路径
        unzip -q -o /tmp/ijk-x86/ijkplayer-x86.aar -d /tmp/ijk-x86/extracted
        cp -r /tmp/ijk-x86/extracted/jni/x86/* player/src/main/jniLibs/x86/
        
        echo "Successfully prepared x86 so files:"
        ls -la player/src/main/jniLibs/x86/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
