plugins {
    id 'com.android.library'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 30

        ndk {
            abiFilters 'armeabi-v7a', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.annotation:annotation:1.2.0'

    // 网络组件
    api 'com.squareup.okhttp3:okhttp:3.12.13'

    // 与源码匹配的 ExoPlayer 2.15.1 组件
    api 'com.google.android.exoplayer:exoplayer-core:2.15.1'
    api 'com.google.android.exoplayer:exoplayer-dash:2.15.1'
    api 'com.google.android.exoplayer:exoplayer-hls:2.15.1'
    api 'com.google.android.exoplayer:exoplayer-ui:2.15.1'
    api 'com.google.android.exoplayer:exoplayer-rtsp:2.15.1'
    api 'com.google.android.exoplayer:extension-rtmp:2.15.1'
    api 'com.google.android.exoplayer:extension-okhttp:2.15.1'
}
