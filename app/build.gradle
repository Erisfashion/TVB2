plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.github.tvbox.osc"
        minSdkVersion 16
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'x86'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        ignoreWarnings true
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/INDEX.LIST'

        pickFirst 'lib/x86/libijkffmpeg.so'
        pickFirst 'lib/x86/libijkplayer.so'
        pickFirst 'lib/x86/libijksdl.so'
        pickFirst 'lib/x86/libxwalkcore.so'
        pickFirst 'lib/x86/libquickjs.so'
        pickFirst 'lib/armeabi-v7a/libijkffmpeg.so'
        pickFirst 'lib/armeabi-v7a/libijkplayer.so'
        pickFirst 'lib/armeabi-v7a/libijksdl.so'
        pickFirst 'lib/armeabi-v7a/libxwalkcore.so'
        pickFirst 'lib/armeabi-v7a/libquickjs.so'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // 注解库
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'org.jetbrains:annotations:19.0.0'

    // Room 本地数据库
    implementation 'androidx.room:room-runtime:2.3.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'

    // 网络与通信组件
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.github.lzyzsd:jsbridge:1.0.4'
    implementation 'com.squareup.picasso:picasso:2.71828'

    // 字幕编码与 IO 流
    implementation 'commons-io:commons-io:2.8.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'

    // QuickJS 核心引擎（Maven Central 官方稳定版，自带 x86/armeabi-v7a 的 libquickjs.so）
    implementation 'com.whl.quickjs:android:0.3.3'

    // 本地 HTTP/WebSocket 服务
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'

    // 二维码与 HTML 爬虫
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'org.jsoup:jsoup:1.14.3'

    // 状态管理与本地存储
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.orhanobut:hawk:2.0.1'

    // 屏幕适配与 TV 列表组件
    implementation 'me.jessyan:autosize:1.2.1'
    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'

    // XML 解析
    implementation ('com.thoughtworks.xstream:xstream:1.4.18') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }

    // Crosswalk 共享组件
    implementation 'org.xwalk:xwalk_shared_library:23.53.589.4'

    implementation project(':player')
}
